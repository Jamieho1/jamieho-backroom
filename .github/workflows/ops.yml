name: Ops
# TKT-59. Daily ping keeps the free Supabase project awake (it pauses after 7 days without activity);
# weekly export saves every table, encrypted, as a private download for 90 days.
# Secrets (Jamie adds them: GitHub → repo → Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, EXPORT_PASSPHRASE
# Note: GitHub turns off scheduled workflows after 60 days with no commits; re-enable in the Actions tab if so.
on:
  schedule:
    - cron: "23 5 * * *" # daily ping, 05:23 UTC
    - cron: "47 5 * * 0" # Sunday export, 05:47 UTC
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run now
        type: choice
        options: [ping, export]
        default: ping
permissions:
  contents: read
jobs:
  ping:
    if: github.event.schedule == '23 5 * * *' || inputs.job == 'ping'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/ops.mjs ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  export:
    if: github.event.schedule == '47 5 * * 0' || inputs.job == 'export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - id: name
        run: echo "file=backroom-export-$(date -u +%F).json.enc" >> "$GITHUB_OUTPUT"
      - run: node scripts/ops.mjs export "${{ steps.name.outputs.file }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPORT_PASSPHRASE: ${{ secrets.EXPORT_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 90
          if-no-files-found: error
