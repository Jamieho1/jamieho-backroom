name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install browsers on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/assert-static.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
